[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rp5-birads-rag"
version = "1.0.0"
description = "BI-RADS-grounded retrieval augmented radiology drafting research prototype"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "sentence-transformers>=2.2",
  "faiss-cpu>=1.7",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "textstat>=0.7",
]

[project.scripts]
rp5 = "rp5.run_experiments:main"

[tool.setuptools.packages.find]
include = ["rp5*"]
